# Application Name
spring.application.name=MFAAuthentication
app.name=MFAAuthentication

# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/mfa_auth_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# Generate a secure secret key (base64 encoded, min 256 bits)
# You can generate one using: openssl rand -base64 64
jwt.secret=7YmJ3aEhYRnlLUVJtWGdHdUgzS2RHVmxlVEp3UXBWdGZaazJMVnNXQ3BRZzR5NlZhRHlreGNHWG9oQlJqVHNEbw==
jwt.expiration=86400000

# Logging
logging.level.com.example.MFAAuthentication=DEBUG
logging.level.org.springframework.security=DEBUG
